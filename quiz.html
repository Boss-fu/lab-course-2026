<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>題庫系統 · 茲茲文教｜自然題庫</title>
<link rel="icon" href="茲茲icon.png">
<style>
/* ============================================================
   茲茲文教 · 自然題庫（題庫系統）
   風格對齊：課務系統 + science-qbank —— 淺色暖紙背景、白卡片、
   墨色文字、紅色點綴、科目色標、頂欄導覽（非側邊欄）。
   ============================================================ */
:root{
  --paper:#f6f5f2; --card:#ffffff; --ink:#2d3038; --muted:#6e6f74;
  --line:#e6e4de; --red:#850103; --red-dark:#6d0002; --gold:#af9a6b; --orange:#f9a12c;
  --bio:#1f6f5c; --phy:#3454b4; --che:#a9600a; --earth:#2a7c74; --lihua:#a0201c;
  --shadow:0 2px 0 #eceae4, 0 8px 24px -12px rgba(45,48,56,.16);
  --shadow-sm:0 1px 2px rgba(43,32,28,.05);
  --ui-font:"PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PingFang TC","Microsoft JhengHei",serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{ font-family:var(--ui-font); background:var(--paper); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased; }

/* ── 頂欄 ── */
.appbar{ background:#fffefb; border-bottom:1px solid var(--line); box-shadow:0 1px 2px rgba(43,32,28,.04);
  position:sticky; top:0; z-index:150; display:flex; align-items:center; gap:14px; padding:12px 28px; }
.appbar .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink); }
.appbar .brand img{ height:34px; width:34px; object-fit:contain; padding-right:12px; border-right:1px solid #dfe3e9; }
.appbar .brand .lock{ display:flex; flex-direction:column; justify-content:center; }
.appbar .brand .t{ display:block; font-family:var(--serif); font-size:1.12rem; font-weight:800; line-height:1.15; letter-spacing:.5px; }
.appbar .brand .s{ display:block; font-size:.62rem; color:var(--muted); letter-spacing:.2em; font-weight:600; margin-top:3px; }
.appbar .spacer{ margin-left:auto; }
.appbar .abtn{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--muted);
  font-size:.82rem; font-weight:600; padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:#fff; transition:.15s; }
.appbar .abtn:hover{ color:var(--red); border-color:#e4c9c6; background:#fdf4f3; }

/* ── 版心 ── */
.wrap{ max-width:1080px; margin:0 auto; padding:1.6rem 1.6rem 3rem; }
.page-head h1{ font-family:var(--serif); font-size:1.5rem; font-weight:800; letter-spacing:.5px; display:flex; align-items:center; gap:.5rem; }
.page-head p{ color:var(--muted); font-size:.88rem; margin-top:.3rem; }

.info-box{ background:#fffdf2; border:1px solid #f0e3b8; color:#7a5b12; border-radius:12px;
  padding:.75rem 1rem; font-size:.83rem; margin:1.2rem 0; line-height:1.7; }
.info-box strong{ color:#5f4708; }

/* ── 統計列 ── */
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:.8rem; margin-bottom:1.2rem; }
.stat{ background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-sm); padding:.85rem 1rem; }
.stat .n{ font-family:var(--serif); font-size:1.55rem; font-weight:800; color:var(--ink); line-height:1; }
.stat .l{ font-size:.73rem; color:var(--muted); margin-top:.35rem; font-weight:600; letter-spacing:.02em; }

/* ── 篩選 ── */
.filters{ display:flex; flex-wrap:wrap; gap:.55rem; align-items:center; margin-bottom:.9rem; }
.filters input[type=text]{ flex:1; min-width:200px; padding:.55rem .85rem; border:1px solid var(--line); border-radius:10px;
  font-family:inherit; font-size:.88rem; background:#fff; color:var(--ink); }
.filters input[type=text]::placeholder{ color:#a7a39b; }
.filters input[type=text]:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(133,1,3,.1); }
.filters select{ padding:.55rem .7rem; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:.85rem; background:#fff; color:var(--ink); cursor:pointer; }
.filters select:focus{ outline:none; border-color:var(--red); }
.count{ font-size:.82rem; color:var(--muted); margin-left:auto; }

.toolbar{ display:flex; gap:.5rem; margin-bottom:1.1rem; flex-wrap:wrap; }
.btn{ font-family:inherit; font-size:.82rem; font-weight:600; letter-spacing:.3px; padding:.5rem 1rem; border-radius:10px;
  border:1px solid #e4d8c6; background:linear-gradient(180deg,#fff,#faf4ea); color:var(--ink); cursor:pointer; transition:.15s; }
.btn:hover{ border-color:var(--gold); }
.btn.primary{ background:linear-gradient(180deg,#960205,#6d0002); color:#fff; border-color:#5c0102;
  box-shadow:0 3px 10px -3px rgba(133,1,3,.55); }
.btn.primary:hover{ filter:brightness(1.05); }

/* ── 題目卡片 ── */
.q-list{ display:flex; flex-direction:column; gap:.85rem; }
.q-card{ background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold);
  border-radius:12px; box-shadow:var(--shadow-sm); padding:1rem 1.15rem; }
.q-top{ display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; margin-bottom:.55rem; }
.tag{ font-size:.7rem; padding:.16rem .55rem; border-radius:7px; font-weight:600; letter-spacing:.2px; background:#f4efe5; color:#6f6353; }
.tag.subj{ color:#fff; }
.tag.stage{ background:#efe7e6; color:var(--red); }
.tag.diff-易{ background:#e7f1ec; color:#1f6f5c; }
.tag.diff-中{ background:#fbf1df; color:#a9600a; }
.tag.diff-難{ background:#fbe9e7; color:#c0392b; }
.q-meta{ font-size:.72rem; color:var(--muted); font-weight:600; margin-left:auto; }
.q-stem{ font-size:.95rem; font-weight:600; color:var(--ink); line-height:1.65; }
.q-options{ list-style:none; margin:.6rem 0 0; padding:0; display:grid; gap:.34rem; }
.q-options li{ font-size:.88rem; color:var(--ink); padding:.36rem .65rem; border:1px solid var(--line); border-radius:8px; background:#fbfaf7; display:flex; gap:.5rem; }
.q-options li .k{ font-weight:800; color:var(--muted); flex-shrink:0; }
.q-card.revealed .q-options li.correct{ background:#eef6f0; border-color:#bfe0cd; }
.q-card.revealed .q-options li.correct .k{ color:var(--bio); }
.q-answer{ display:none; margin-top:.7rem; padding:.72rem .9rem; background:#fffdf2; border:1px solid #f0e3b8; border-radius:10px; font-size:.85rem; line-height:1.7; }
.q-card.revealed .q-answer{ display:block; }
.q-answer .lab{ font-weight:800; color:#7a5b12; }
.q-answer .exp{ color:var(--ink); margin-top:.3rem; }
.q-foot{ display:flex; align-items:center; gap:.5rem; margin-top:.7rem; flex-wrap:wrap; }
.reveal{ font-family:inherit; font-size:.78rem; font-weight:600; padding:.36rem .9rem; border-radius:9px; cursor:pointer; transition:.15s;
  background:linear-gradient(180deg,#960205,#6d0002); color:#fff; border:1px solid #5c0102; box-shadow:0 3px 10px -3px rgba(133,1,3,.5); }
.q-card.revealed .reveal{ background:#fff; color:var(--red); border-color:#e4c9c6; box-shadow:none; }
.kw{ font-size:.68rem; color:#9a948a; background:#f4efe9; padding:.1rem .45rem; border-radius:20px; }
.empty{ padding:2.5rem; text-align:center; color:var(--muted); }

@media (max-width:640px){
  .appbar{ padding:10px 14px; }
  .appbar .brand .s{ display:none; }
  .wrap{ padding:1.1rem 1rem 2.4rem; }
}
</style>
</head>
<body>

<header class="appbar">
  <a class="brand" href="index.html">
    <img src="茲茲icon.png" alt="茲茲">
    <span class="lock"><span class="t">茲茲文教｜自然題庫</span><span class="s">TZUTZU SCIENCE QBANK · QUESTION BANK</span></span>
  </a>
  <span class="spacer"></span>
  <a class="abtn" href="index.html">🏠 課務系統</a>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>題庫系統</h1>
    <p>依科目、學制、題型與難度整理的練習題庫 — 可即時顯示答案與詳解，適合課後複習與命題參考</p>
  </div>

  <div class="info-box">
    此為<strong>種子題庫</strong>（持續擴充、可再細修）。用下方篩選列依學制、科目、題型、難度快速找題；點「顯示答案」即可看到正解與解析。
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters">
    <input type="text" id="search" placeholder="搜尋題幹、關鍵字…">
    <select id="fStage"><option value="">全部學制</option><option>國中</option><option>高中</option></select>
    <select id="fSubject"><option value="">全部科目</option><option>生物</option><option>理化</option><option>物理</option><option>化學</option><option>地球科學</option></select>
    <select id="fType"><option value="">全部題型</option><option>選擇</option><option>是非</option><option>填充</option><option>簡答</option><option>探究</option></select>
    <select id="fDiff"><option value="">全部難度</option><option>易</option><option>中</option><option>難</option></select>
    <span class="count" id="count"></span>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="revealAll">顯示全部答案</button>
    <button class="btn" id="hideAll">收合全部答案</button>
  </div>

  <div class="q-list" id="list"></div>
  <div class="empty" id="empty" style="display:none">沒有符合條件的題目</div>
</main>

<script src="js/quiz-data.js?v=2"></script>
<script>
const KEY=['A','B','C','D','E','F'];
const DIFFC={'易':'','中':'','難':''};
const SUBJ={ '生物':'var(--bio)', '理化':'var(--lihua)', '物理':'var(--phy)', '化學':'var(--che)', '地球科學':'var(--earth)' };

// 統計列
(function(){
  const total=QUIZ_BANK.length;
  const s=[
    {n:total,l:'題目總數'},
    {n:QUIZ_BANK.filter(q=>q.type==='選擇').length,l:'選擇題'},
    {n:QUIZ_BANK.filter(q=>q.stage==='國中').length,l:'國中題'},
    {n:QUIZ_BANK.filter(q=>q.stage==='高中').length,l:'高中題'},
    {n:[...new Set(QUIZ_BANK.map(q=>q.subject))].length,l:'涵蓋科目'},
  ];
  document.getElementById('stats').innerHTML=s.map(x=>`<div class="stat"><div class="n">${x.n}</div><div class="l">${x.l}</div></div>`).join('');
})();

function answerHtml(q){
  let ans;
  if(q.type==='選擇') ans=`${KEY[q.answer]}. ${q.options[q.answer]}`;
  else if(q.type==='是非') ans=q.answer?'○（正確）':'✕（錯誤）';
  else ans=q.answer;
  return `<div class="q-answer"><span class="lab">✔ 參考答案：</span>${ans}`
    +(q.explanation?`<div class="exp"><strong>解析：</strong>${q.explanation}</div>`:'')+`</div>`;
}
function optionsHtml(q){
  if(q.type!=='選擇'||!q.options||!q.options.length) return '';
  return `<ul class="q-options">${q.options.map((o,i)=>
    `<li class="${i===q.answer?'correct':''}"><span class="k">${KEY[i]}</span><span>${o}</span></li>`).join('')}</ul>`;
}
function card(q){
  const col=SUBJ[q.subject]||'var(--gold)';
  const kws=(q.tags||[]).slice(0,4).map(t=>`<span class="kw">#${t}</span>`).join('');
  return `<div class="q-card" style="border-left-color:${col}">
    <div class="q-top">
      <span class="tag stage">${q.stage}</span>
      <span class="tag subj" style="background:${col}">${q.subject}</span>
      <span class="tag">${q.type}題</span>
      <span class="tag diff-${q.difficulty}">${q.difficulty}</span>
      <span class="q-meta">${q.grade}</span>
    </div>
    <div class="q-stem">${q.stem}</div>
    ${optionsHtml(q)}
    ${answerHtml(q)}
    <div class="q-foot"><button class="reveal">顯示答案</button>${kws}</div>
  </div>`;
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const fst=document.getElementById('fStage').value, fsu=document.getElementById('fSubject').value;
  const fty=document.getElementById('fType').value, fdf=document.getElementById('fDiff').value;
  const rows=QUIZ_BANK.filter(it=>{
    if(fst&&it.stage!==fst) return false;
    if(fsu&&it.subject!==fsu) return false;
    if(fty&&it.type!==fty) return false;
    if(fdf&&it.difficulty!==fdf) return false;
    if(q){ const hay=`${it.stem} ${(it.tags||[]).join(' ')} ${(it.options||[]).join(' ')}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const box=document.getElementById('list');
  box.innerHTML=rows.map(card).join('');
  document.getElementById('empty').style.display=rows.length?'none':'block';
  document.getElementById('count').textContent=`顯示 ${rows.length} / ${QUIZ_BANK.length} 題`;
  box.querySelectorAll('.q-card').forEach(c=>{
    const b=c.querySelector('.reveal');
    b.addEventListener('click',()=>{ const on=c.classList.toggle('revealed'); b.textContent=on?'收合答案':'顯示答案'; });
  });
}
document.getElementById('revealAll').addEventListener('click',()=>document.querySelectorAll('.q-card').forEach(c=>{c.classList.add('revealed');c.querySelector('.reveal').textContent='收合答案';}));
document.getElementById('hideAll').addEventListener('click',()=>document.querySelectorAll('.q-card').forEach(c=>{c.classList.remove('revealed');c.querySelector('.reveal').textContent='顯示答案';}));
['search','fStage','fSubject','fType','fDiff'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));
render();
</script>
</body>
</html>
