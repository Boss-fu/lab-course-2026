<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程目錄 · 茲茲實驗課務系統</title>
<link rel="icon" href="茲茲icon.png">
<link rel="stylesheet" href="css/style2.css">
<link rel="stylesheet" href="css/app.css">
<style>
.filter-bar { display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center; margin-bottom:1.2rem; }
.filter-bar select{ padding:0.5rem 0.7rem; border:1.5px solid var(--border); border-radius:9px; font-family:inherit; font-size:0.86rem; background:var(--white); cursor:pointer; }
.filter-bar select:focus{ outline:none; border-color:var(--tzu-red); }
.count-pill{ font-size:0.82rem; color:var(--text-light); margin-left:auto; }
.prog-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1.1rem; }
.prog-card{ background:var(--white); border:1px solid var(--border); border-top:4px solid #ccc; border-radius:16px; box-shadow:var(--shadow-sm); padding:1.2rem 1.3rem; display:flex; flex-direction:column; gap:0.55rem; transition:transform .15s, box-shadow .15s; }
.prog-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow); }
.pc-type{ display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
.type-tag{ font-size:0.72rem; font-weight:800; padding:0.16rem 0.6rem; border-radius:20px; background:var(--tzu-red-soft); color:var(--tzu-red); }
.type-tag.帶狀週課{ background:#f1ede6; color:#6f6353; }
.type-tag.短期營隊{ background:var(--tzu-gold-soft); color:var(--tzu-gold-dark); }
.type-tag.主題工作坊{ background:#f1ede6; color:#6f6353; }
.pc-name{ font-size:1.15rem; font-weight:800; color:var(--text); line-height:1.3; }
.pc-aud{ font-size:0.84rem; color:var(--text-light); }
.pc-meta{ display:flex; gap:0.45rem; flex-wrap:wrap; margin-top:0.2rem; }
.pc-chip{ font-size:0.74rem; padding:0.16rem 0.55rem; border-radius:20px; background:#F4EFE6; color:var(--text-light); font-weight:600; }
.pc-note{ font-size:0.8rem; color:var(--text-light); line-height:1.7; }
.pc-foot{ display:flex; align-items:center; gap:0.5rem; margin-top:auto; padding-top:0.7rem; border-top:1px solid var(--border); }
.pc-link{ background:var(--tzu-red); color:#fff; text-decoration:none; padding:0.35rem 0.9rem; border-radius:8px; font-size:0.78rem; font-weight:700; }
.pc-link:hover{ background:var(--tzu-red-dark); }
.pc-soon{ font-size:0.78rem; color:var(--text-light); }
.st{ font-size:0.72rem; font-weight:700; padding:0.16rem 0.55rem; border-radius:20px; margin-left:auto; }
.st-ready{ background:var(--tzu-red-soft); color:var(--tzu-red); } .st-draft{ background:#f1ede6; color:#6f6353; } .st-planned{ background:var(--tzu-orange-soft); color:#6f6353; }
.plan-hint{ background:#FFFBEB; border:1.5px solid #FCD34D; color:#92400E; border-radius:10px; padding:0.7rem 1rem; font-size:0.83rem; margin-bottom:1.2rem; line-height:1.7; }
</style>
</head>
<body>

<div id="app-shell" data-active="courses"></div>

<main class="app-main">
  <div class="page-head">
    <h1>課程目錄</h1>
    <p>所有課程方案 — 帶狀班、營隊、主題工作坊。2026 暑期只是其中兩套</p>
  </div>
  <div class="page-body">
    <div class="plan-hint">
      每一套課程都是從<strong>實驗庫</strong>挑實驗組成堂次。之後的「課程規劃器」會讓你直接在網頁上挑實驗、排堂、設定客群，馬上生出一套新課程。
    </div>

    <div class="filter-bar">
      <select id="fType"><option value="">全部型態</option><option>帶狀週課</option><option>短期營隊</option><option>主題工作坊</option></select>
      <select id="fStatus"><option value="">全部狀態</option><option>開課中</option><option>規劃中</option><option>已完課</option></select>
      <span class="count-pill" id="countPill"></span>
    </div>

    <div class="prog-grid" id="grid"></div>
  </div>
</main>

<script src="js/courses.js?v=1"></script>
<script src="js/shell.js?v=1"></script>
<script>
function render(){
  const ft=document.getElementById('fType').value, fs=document.getElementById('fStatus').value;
  const rows=COURSE_PROGRAMS.filter(p=>(!ft||p.type===ft)&&(!fs||p.status===fs));
  document.getElementById('grid').innerHTML = rows.map(p=>{
    const accent=ACCENT_HEX[p.accent]||'#ccc';
    const st=(PROGRAM_STATUS_META[p.status]||{}).cls||'st-planned';
    const foot = p.detail
      ? `<a class="pc-link" href="${p.detail}">查看課程 →</a>`
      : `<span class="pc-soon">待規劃器排課</span>`;
    return `<div class="prog-card" style="border-top-color:${accent}">
      <div class="pc-type"><span class="type-tag ${p.type}">${p.type}</span>
        <span class="pc-chip">${p.subjectFocus}</span></div>
      <div class="pc-name">${p.name}</div>
      <div class="pc-aud">${p.audience}</div>
      <div class="pc-meta">
        <span class="pc-chip">${p.sessions?p.sessions+' 堂':'堂數待定'}</span>
        <span class="pc-chip">每堂 ${p.minutesPer} 分</span>
        <span class="pc-chip">${p.cadence}</span>
        <span class="pc-chip">${p.period}</span></div>
      <div class="pc-note">${p.note}</div>
      <div class="pc-foot">${foot}<span class="st ${st}">${p.status}</span></div>
    </div>`;
  }).join('');
  document.getElementById('countPill').textContent = `顯示 ${rows.length} / ${COURSE_PROGRAMS.length} 套課程`;
}
['fType','fStatus'].forEach(id=>document.getElementById(id).addEventListener('change', render));
render();
</script>
</body>
</html>
