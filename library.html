<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>創意實驗 · 茲茲實驗課務系統</title>
<link rel="icon" href="茲茲icon.png">
<link rel="stylesheet" href="css/style2.css">
<link rel="stylesheet" href="css/app.css">
<style>
.filter-bar { display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center; margin-bottom:1rem; }
.filter-bar input[type=text]{ flex:1; min-width:200px; padding:0.5rem 0.8rem; border:1.5px solid var(--border); border-radius:9px; font-family:inherit; font-size:0.88rem; background:var(--white); }
.filter-bar input[type=text]:focus{ outline:none; border-color:var(--tzu-red); box-shadow:0 0 0 3px rgba(133,1,3,.1); }
.filter-bar select{ padding:0.5rem 0.7rem; border:1.5px solid var(--border); border-radius:9px; font-family:inherit; font-size:0.86rem; background:var(--white); cursor:pointer; }
.filter-bar select:focus{ outline:none; border-color:var(--tzu-red); }
.count-pill{ font-size:0.82rem; color:var(--text-light); margin-left:auto; }
.lib-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; }
.lib-card{ background:var(--white); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-sm); padding:1rem 1.1rem; display:flex; flex-direction:column; gap:0.5rem; transition:transform .15s, box-shadow .15s; }
.lib-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
.lib-top{ display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
.lib-no{ font-size:0.72rem; font-weight:800; color:#fff; background:var(--tzu-red); border-radius:6px; padding:0.12rem 0.5rem; }
.lib-no.none{ background:#C9BFA9; }
.cat-tag{ font-size:0.73rem; font-weight:700; padding:0.12rem 0.55rem; border-radius:20px; }
.lib-name{ font-size:1rem; font-weight:800; color:var(--text); line-height:1.35; }
.lib-topic{ font-size:0.82rem; color:var(--text-light); line-height:1.7; }
.lib-meta{ display:flex; gap:0.4rem; flex-wrap:wrap; margin-top:0.15rem; }
.chip{ font-size:0.72rem; padding:0.14rem 0.5rem; border-radius:20px; background:#F4EFE6; color:var(--text-light); font-weight:600; }
.chip.grade{ background:var(--tzu-gold-soft); color:var(--tzu-gold-dark); }
.lib-foot{ display:flex; align-items:center; gap:0.5rem; margin-top:auto; padding-top:0.6rem; border-top:1px solid var(--border); }
.st{ font-size:0.72rem; font-weight:700; padding:0.16rem 0.55rem; border-radius:20px; }
.st-ready{ background:#E7F6EE; color:#1E8A52; } .st-draft{ background:#EEF3FB; color:#3E6FB0; } .st-planned{ background:var(--tzu-orange-soft); color:#A9600A; }
.lib-link{ margin-left:auto; font-size:0.76rem; font-weight:700; color:var(--tzu-red); text-decoration:none; }
.lib-link:hover{ text-decoration:underline; }
.vid-link{ font-size:0.76rem; color:var(--text-light); text-decoration:none; margin-left:auto; }
.prog-track{ height:10px; border-radius:6px; background:#EAE3D5; overflow:hidden; display:flex; margin-bottom:0.5rem; }
.prog-ready{ background:var(--green); } .prog-draft{ background:#5A86C4; } .prog-plan{ background:var(--tzu-orange); }
.prog-legend{ display:flex; gap:1.1rem; flex-wrap:wrap; font-size:0.8rem; color:var(--text-light); margin-bottom:1.2rem; }
.prog-legend b{ color:var(--text); }
.empty-note{ padding:2.5rem; text-align:center; color:var(--text-light); }
</style>
</head>
<body>

<div id="app-shell" data-active="lib"></div>

<main class="app-main">
  <div class="page-head">
    <h1>🎨 創意實驗</h1>
    <p>茲茲招牌創意實驗目錄 — 每個實驗都是課程堂次的積木，可跨年段重複使用</p>
  </div>
  <div class="page-body">
    <div class="prog-track" id="prog-track"></div>
    <div class="prog-legend" id="prog-legend"></div>

    <div class="filter-bar">
      <input type="text" id="search" placeholder="🔍 搜尋實驗名稱、科學觀念…">
      <select id="fCat"><option value="">全部分類</option><option>物理</option><option>化學</option><option>生物</option><option>跨領域</option></select>
      <select id="fGrade"><option value="">全部年段</option><option>國小</option><option>國七</option><option>國八</option><option>國中</option><option>銜接</option></select>
      <select id="fStatus"><option value="">全部狀態</option><option value="ready">✅ 講義完成</option><option value="draft">📝 講義草稿</option><option value="planned">🗂 規劃中</option></select>
      <span class="count-pill" id="countPill"></span>
    </div>

    <div class="lib-grid" id="grid"></div>
    <div class="empty-note" id="emptyNote" style="display:none">沒有符合條件的實驗</div>
  </div>
</main>

<script src="js/experiments.js?v=2"></script>
<script src="js/shell.js?v=1"></script>
<script>
function renderProgress(){
  const n={ready:0,draft:0,planned:0}; EXPERIMENTS.forEach(e=>n[e.status]++);
  const total=EXPERIMENTS.length, pct=k=>(n[k]/total*100).toFixed(1)+'%';
  document.getElementById('prog-track').innerHTML =
    `<div class="prog-ready" style="width:${pct('ready')}"></div><div class="prog-draft" style="width:${pct('draft')}"></div><div class="prog-plan" style="width:${pct('planned')}"></div>`;
  document.getElementById('prog-legend').innerHTML =
    `<span>共 <b>${total}</b> 個創意實驗</span><span>✅ 講義完成 <b>${n.ready}</b></span><span>📝 草稿 <b>${n.draft}</b></span><span>🗂 規劃中 <b>${n.planned}</b></span>`;
}
function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const fc=document.getElementById('fCat').value, fg=document.getElementById('fGrade').value, fs=document.getElementById('fStatus').value;
  const rows=EXPERIMENTS.filter(e=>{
    if(fc&&e.category!==fc) return false;
    if(fg){ const g=e.grades||[]; const hit=g.includes(fg)||(fg==='國中'&&(g.includes('國七')||g.includes('國八')||g.includes('國中')||g.includes('銜接'))); if(!hit) return false; }
    if(fs&&e.status!==fs) return false;
    if(q&&!(`${e.name} ${e.topic} ${(e.grades||[]).join('')}`.toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('grid').innerHTML = rows.map(e=>{
    const c=CATEGORY_COLOR[e.category]||{bg:'#eee',fg:'#555'}, st=STATUS_META[e.status];
    const noBadge=e.no!=null?`<span class="lib-no">實驗 ${e.no}</span>`:`<span class="lib-no none">未編號</span>`;
    const grades=(e.grades||[]).map(g=>`<span class="chip grade">${g}</span>`).join('');
    const handout=e.handout?`<a class="lib-link" href="${e.handout}" target="_blank">📄 開啟講義</a>`:(e.video&&e.video.length?`<a class="vid-link" href="${e.video[0]}" target="_blank">▶ 參考影片</a>`:'');
    return `<div class="lib-card"><div class="lib-top">${noBadge}<span class="cat-tag" style="background:${c.bg};color:${c.fg}">${e.category}</span></div>
      <div class="lib-name">${e.name}</div><div class="lib-topic">${e.topic}</div>
      <div class="lib-meta"><span class="chip">⏱ ${e.minutes} 分</span><span class="chip">難度 ${e.difficulty}</span>${grades}${e.takeHome?`<span class="chip">🎁 ${e.takeHome}</span>`:''}</div>
      <div class="lib-foot"><span class="st ${st.cls}">${st.label}</span>${handout}</div></div>`;
  }).join('');
  document.getElementById('emptyNote').style.display = rows.length?'none':'block';
  document.getElementById('countPill').textContent = `顯示 ${rows.length} / ${EXPERIMENTS.length} 個實驗`;
}
['search','fCat','fGrade','fStatus'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change', render));
renderProgress(); render();
</script>
</body>
</html>
