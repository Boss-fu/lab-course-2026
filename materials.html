<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實驗與器材 — 茲茲實驗課</title>
<link rel="icon" href="茲茲icon.png">
<link rel="stylesheet" href="css/style2.css">
<link rel="stylesheet" href="css/app.css">
<style>
/* ── Toolbar ── */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
  padding: 1rem 2rem 0;
}
.toolbar input[type=text] {
  flex: 1; min-width: 200px;
  padding: 0.5rem 0.8rem; border: 1.5px solid var(--border);
  border-radius: 9px; font-family: inherit; font-size: 0.88rem; background: var(--white);
}
.toolbar input[type=text]:focus { outline: none; border-color: var(--tzu-red); box-shadow: 0 0 0 3px rgba(133,1,3,0.10); }
.toolbar select {
  padding: 0.5rem 0.7rem; border: 1.5px solid var(--border);
  border-radius: 9px; font-family: inherit; font-size: 0.86rem; background: var(--white); cursor: pointer;
}
.toolbar select:focus { outline: none; border-color: var(--tzu-red); }
.chk-flag { display: flex; align-items: center; gap: 0.35rem; font-size: 0.83rem; color: var(--text-light); cursor: pointer; white-space: nowrap; }
.chk-flag input { accent-color: var(--tzu-red); width: 16px; height: 16px; }
.count-pill { font-size: 0.82rem; color: var(--text-light); }

/* ── Inventory table ── */
.inv-wrap { padding: 1rem 2rem 3rem; overflow-x: auto; }
.inv-table { width: 100%; border-collapse: collapse; background: var(--white);
  border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); font-size: 0.85rem; }
.inv-table thead th {
  background: var(--tzu-gold-soft); color: var(--tzu-gold-dark);
  font-size: 0.8rem; text-align: left; padding: 0.6rem 0.7rem;
  border-bottom: 2px solid var(--border); white-space: nowrap; position: sticky; top: 0; z-index: 5;
}
.inv-table tbody td { padding: 0.5rem 0.7rem; border-bottom: 1px solid #F0EBE0; vertical-align: middle; }
.inv-table tbody tr:hover { background: #FBF7F0; }
.inv-table tbody tr.flagged { background: #FFF6EC; }
.inv-table tbody tr.flagged:hover { background: #FEEFD9; }
.inv-tag { display: inline-block; background: var(--tzu-gold-soft); color: var(--tzu-gold-dark);
  padding: 0.1rem 0.55rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
.inv-muted { color: #B7AE9C; }
.flag-tag { display: inline-block; background: var(--tzu-red-soft); color: var(--tzu-red);
  padding: 0.1rem 0.55rem; border-radius: 12px; font-size: 0.72rem; font-weight: 600; }
.qty-input { width: 58px; padding: 0.25rem 0.4rem; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.83rem; font-family: inherit; }
.qty-input:focus { outline: none; border-color: var(--tzu-red); }
.rowchk { accent-color: var(--tzu-red); width: 17px; height: 17px; cursor: pointer; }
.empty-note { padding: 2.5rem; text-align: center; color: var(--text-light); }

/* ── Cart FAB + modal ── */
.cart-fab {
  position: fixed; right: 20px; bottom: 20px;
  background: var(--tzu-red); color: #fff; border: none;
  border-radius: 30px; padding: 0.8rem 1.2rem;
  box-shadow: 0 8px 22px rgba(133,1,3,0.35); cursor: pointer;
  font-size: 0.9rem; font-weight: 700; font-family: inherit; z-index: 40;
  display: flex; align-items: center; gap: 0.4rem;
}
.cart-fab .n { background: var(--tzu-orange); color: #fff; border-radius: 50%;
  min-width: 22px; height: 22px; line-height: 22px; text-align: center; font-size: 0.78rem; padding: 0 0.3rem; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(40,30,20,0.5); z-index: 60; }
.modal-bg.show { display: flex; align-items: flex-start; justify-content: center; padding: 3rem 1rem; overflow: auto; }
.modal { background: #fff; border-radius: 16px; max-width: 760px; width: 100%; padding: 1.6rem; max-height: 88vh; overflow: auto; box-shadow: var(--shadow); }
.modal h2 { font-size: 1.15rem; color: var(--tzu-red); margin-bottom: 0.4rem; }
.lesson-meta { display: flex; gap: 0.6rem; margin: 0.8rem 0 1rem; flex-wrap: wrap; }
.lesson-meta input { flex: 1; min-width: 160px; padding: 0.5rem 0.7rem; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 0.85rem; }
.lesson-meta input:focus { outline: none; border-color: var(--tzu-red); }
.cart-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.cart-table th { background: var(--tzu-gold-soft); color: var(--tzu-gold-dark); text-align: left; padding: 0.5rem 0.6rem; font-size: 0.78rem; }
.cart-table td { padding: 0.45rem 0.6rem; border-bottom: 1px solid #F0EBE0; }
.modal-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; flex-wrap: wrap; }
.mini-del { background: none; border: 1.5px solid #E8C0BC; color: var(--tzu-red); border-radius: 6px; padding: 0.2rem 0.5rem; font-size: 0.76rem; cursor: pointer; }
.mini-del:hover { background: var(--tzu-red-soft); }

/* ── 實驗總表 grid ── */
.exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 1rem 2rem 3rem; }
.exp-card { background: var(--white); border-radius: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); padding: 1rem; border-left: 4px solid var(--tzu-gold); }
.exp-card.cat-化學 { border-left-color: var(--tzu-orange); }
.exp-card.no-id { opacity: 0.72; border-left-style: dashed; }
.exp-card h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 0.4rem; }
.exp-card .meta { font-size: 0.76rem; color: var(--text-light); display: flex; gap: 0.6rem; flex-wrap: wrap; }
.exp-id { font-size: 0.72rem; font-weight: 700; background: var(--tzu-red); color: #fff; padding: 0.12rem 0.45rem; border-radius: 5px; }
.exp-id.cat-化學 { background: var(--tzu-orange); }

.stats-bar { display: flex; gap: 1.4rem; flex-wrap: wrap; padding: 0.9rem 2rem; background: rgba(255,255,255,0.7); border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.stats-bar .stat strong { color: var(--tzu-red); font-size: 1rem; }

@media (max-width: 640px) {
  .toolbar, .inv-wrap, .exp-grid, .stats-bar { padding-left: 1rem; padding-right: 1rem; }
  .inv-table thead th { top: 0; }
}
@media print {
  .toolbar, .cart-fab, .tabs, .stats-bar, .no-print { display: none !important; }
  .modal-bg { position: static; background: none; padding: 0; display: block; }
  .modal { box-shadow: none; max-width: none; max-height: none; }
}
</style>
</head>
<body>

<div id="app-shell" data-active="materials"></div>

<main class="app-main">

<div class="hero" style="padding:1.8rem 2rem 1.6rem">
  <h1>實驗與器材</h1>
  <p>茲茲實驗室器材庫存 ｜ 勾選建立課堂清單 ｜ 實驗總表</p>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="tabs" id="tabs" style="padding:0 1rem;overflow-x:auto"></div>

<!-- Inventory view -->
<div id="inventoryView">
  <div class="toolbar">
    <input type="text" id="search" placeholder="🔍 搜尋名稱、規格、存放位置、分類…">
    <select id="catFilter"><option value="">全部分類</option></select>
    <select id="locFilter"><option value="">全部存放位置</option></select>
    <label class="chk-flag"><input type="checkbox" id="onlyFlagged"> 只看需人工確認</label>
    <span class="count-pill" id="countPill"></span>
  </div>
  <div class="inv-wrap">
    <table class="inv-table" id="invTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
    <div class="empty-note" id="emptyNote" style="display:none">沒有符合條件的器材</div>
  </div>
</div>

<!-- 實驗總表 view -->
<div id="expView" style="display:none">
  <div class="exp-grid" id="exp-grid"></div>
</div>

<button class="cart-fab no-print" id="cartFab">📋 課堂清單 <span class="n" id="cartCount">0</span></button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">📋 本堂課器材清單</h2>
    <div class="lesson-meta no-print">
      <input type="text" id="lessonName" placeholder="課程／單元名稱（例：國八 酸鹼中和）">
      <input type="text" id="lessonDate" placeholder="日期／班級（例：7/30 週三B班）">
    </div>
    <div style="overflow-x:auto">
      <table class="cart-table">
        <thead><tr><th>名稱</th><th>規格</th><th>需求數量</th><th>單位</th><th>存放位置</th><th>分區</th><th class="no-print"></th></tr></thead>
        <tbody id="cartRows"></tbody>
      </table>
    </div>
    <div class="modal-actions no-print">
      <button class="btn btn-primary" onclick="window.print()">🖨️ 列印 / 存 PDF</button>
      <button class="btn btn-outline" id="clearCart">清空清單</button>
      <button class="btn" style="background:#EFEAE0;color:var(--text)" id="closeModal">關閉</button>
    </div>
  </div>
</div>

<script src="js/materials-data.js?v=3"></script>
<script src="js/inventory-data.js?v=1"></script>
<script>
const CATS = ['工具','耗材','實驗藥品','實驗專用器材'];
const EXP_TAB = '實驗總表';
const TAB_ORDER = [...CATS, EXP_TAB];
let activeTab = CATS[0];
let cart = {};

function colIndex(cols, name){ return cols.indexOf(name); }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

/* ── Cart persistence ── */
function loadCart(){ try{ cart = JSON.parse(localStorage.getItem('labInventoryCart')||'{}'); }catch(e){ cart={}; } }
function saveCart(){ localStorage.setItem('labInventoryCart', JSON.stringify(cart)); document.getElementById('cartCount').textContent = Object.keys(cart).length; }

/* ── Stats ── */
function renderStats(){
  const total = CATS.reduce((a,c)=>a+INVENTORY[c].rows.length,0);
  const flagged = CATS.reduce((a,c)=>{
    const fi = colIndex(INVENTORY[c].columns,'需人工確認');
    return a + INVENTORY[c].rows.filter(r=>fi>=0 && r[fi]).length;
  },0);
  document.getElementById('stats-bar').innerHTML =
    `<div class="stat">共 <strong>${total}</strong> 項器材</div>` +
    CATS.map(c=>`<div class="stat">${c} <strong>${INVENTORY[c].rows.length}</strong></div>`).join('') +
    (flagged ? `<div class="stat" style="margin-left:auto">⚠️ <strong style="color:var(--red)">${flagged}</strong> 項需人工確認</div>` : '');
}

/* ── Tabs ── */
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = TAB_ORDER.map(t=>{
    const n = (t===EXP_TAB) ? ALL_EXPERIMENTS.length : INVENTORY[t].rows.length;
    return `<button class="tab ${t===activeTab?'active':''}" data-tab="${t}">${t} <span style="opacity:.6;font-weight:600">${n}</span></button>`;
  }).join('');
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    activeTab = b.dataset.tab;
    renderTabs();
    if(activeTab===EXP_TAB){
      document.getElementById('inventoryView').style.display='none';
      document.getElementById('expView').style.display='block';
      renderExperiments();
    } else {
      document.getElementById('expView').style.display='none';
      document.getElementById('inventoryView').style.display='block';
      populateFilters(); renderTable();
    }
  });
}

/* ── Filters ── */
function populateFilters(){
  const cols = INVENTORY[activeTab].columns;
  const ci = colIndex(cols,'分類'), li = colIndex(cols,'存放位置');
  const cats=new Set(), locs=new Set();
  INVENTORY[activeTab].rows.forEach(r=>{ if(ci>=0&&r[ci])cats.add(r[ci]); if(li>=0&&r[li])locs.add(r[li]); });
  document.getElementById('catFilter').innerHTML = '<option value="">全部分類</option>' + [...cats].sort().map(c=>`<option>${c}</option>`).join('');
  document.getElementById('locFilter').innerHTML = '<option value="">全部存放位置</option>' + [...locs].sort().map(c=>`<option>${c}</option>`).join('');
}

/* ── Table ── */
function renderTable(){
  const meta = INVENTORY[activeTab];
  const cols = meta.columns.filter(c=>c!=='需人工確認');
  const flagIdx = colIndex(meta.columns,'需人工確認');
  const nameI = colIndex(meta.columns,'中文名稱');
  const specI = colIndex(meta.columns,'規格');
  const unitI = colIndex(meta.columns,'單位');
  const locI  = colIndex(meta.columns,'存放位置');
  const catI  = colIndex(meta.columns,'分類');

  document.getElementById('headRow').innerHTML =
    '<th class="no-print">選</th>' + cols.map(c=>`<th>${c}</th>`).join('') + '<th class="no-print">課堂數量</th>';

  const q = document.getElementById('search').value.trim().toLowerCase();
  const catF = document.getElementById('catFilter').value;
  const locF = document.getElementById('locFilter').value;
  const onlyFlagged = document.getElementById('onlyFlagged').checked;

  const body = document.getElementById('bodyRows');
  body.innerHTML = '';
  let shown = 0;

  meta.rows.forEach(r=>{
    const flagVal = flagIdx>=0 ? (r[flagIdx]||'') : '';
    if(onlyFlagged && !flagVal) return;
    if(catF && r[catI]!==catF) return;
    if(locF && r[locI]!==locF) return;
    if(q && !r.map(x=>String(x||'')).join(' ').toLowerCase().includes(q)) return;
    shown++;
    const key = activeTab+'||'+(r[nameI]||'')+'||'+(r[specI]||'');
    const inCart = !!cart[key];
    const tr = document.createElement('tr');
    if(flagVal) tr.classList.add('flagged');

    let tds = `<td class="no-print"><input type="checkbox" class="rowchk" data-key="${escapeAttr(key)}" ${inCart?'checked':''}></td>`;
    cols.forEach(c=>{
      const ci = colIndex(meta.columns,c);
      let val = r[ci];
      if(c==='分類' && val) tds += `<td><span class="inv-tag">${val}</span></td>`;
      else if(c==='需人工確認') {}
      else if(val===null||val===undefined||val==='') tds += `<td class="inv-muted">—</td>`;
      else tds += `<td>${val}</td>`;
    });
    const defQty = r[colIndex(meta.columns,'數量')] || 1;
    const qtyVal = inCart ? cart[key].qty : defQty;
    tds += `<td class="no-print"><input type="number" min="0" class="qty-input rowqty" data-key="${escapeAttr(key)}" value="${qtyVal||''}" ${inCart?'':'disabled'}></td>`;
    tr.innerHTML = tds;
    body.appendChild(tr);

    tr.querySelector('.rowchk').addEventListener('change', e=>{
      const qtyInput = tr.querySelector('.rowqty');
      if(e.target.checked){
        qtyInput.disabled=false;
        cart[key] = { sheet:activeTab, name:r[nameI]||'', spec:r[specI]||'', unit:unitI>=0?(r[unitI]||''):'', loc:locI>=0?(r[locI]||''):'', qty:qtyInput.value||1 };
      } else { qtyInput.disabled=true; delete cart[key]; }
      saveCart();
    });
    tr.querySelector('.rowqty').addEventListener('input', e=>{ if(cart[key]){ cart[key].qty=e.target.value; saveCart(); } });
  });

  document.getElementById('emptyNote').style.display = shown===0 ? 'block':'none';
  document.getElementById('countPill').textContent = `顯示 ${shown} / ${meta.rows.length} 筆`;
}

/* ── Cart modal ── */
function renderCart(){
  const rows = document.getElementById('cartRows');
  const keys = Object.keys(cart);
  if(keys.length===0){ rows.innerHTML = '<tr><td colspan="7" class="inv-muted" style="text-align:center;padding:1.5rem">尚未勾選任何器材</td></tr>'; }
  else rows.innerHTML = keys.map(k=>{
    const it = cart[k];
    return `<tr><td>${it.name}</td><td>${it.spec||'—'}</td><td>${it.qty}</td><td>${it.unit||'—'}</td><td>${it.loc||'—'}</td><td>${it.sheet}</td>
      <td class="no-print"><button class="mini-del" data-key="${escapeAttr(k)}">移除</button></td></tr>`;
  }).join('');
  rows.querySelectorAll('.mini-del').forEach(b=>b.onclick=()=>{ delete cart[b.dataset.key]; saveCart(); renderCart(); renderTable(); });
  const nm = document.getElementById('lessonName').value;
  document.getElementById('modalTitle').textContent = '📋 本堂課器材清單' + (nm ? '　' + nm : '');
}

/* ── 實驗總表 ── */
const SESSION_LINK_MAP = {
  'P01':'teacher.html?s=1','C01':'teacher.html?s=2','P02':'teacher.html?s=4',
  'P03':'teacher.html?s=5','C02':'teacher.html?s=6','中1':'teacher.html?course=middle&s=1'
};
function renderExperiments(){
  const grid = document.getElementById('exp-grid');
  grid.innerHTML = ALL_EXPERIMENTS.map(e=>{
    const idBadge = e.id ? `<span class="exp-id cat-${e.cat}">${e.id}</span>` : `<span style="font-size:0.72rem;color:#B7AE9C">規劃中</span>`;
    const link = SESSION_LINK_MAP[e.id] ? `<a class="card-footer" href="${SESSION_LINK_MAP[e.id]}" style="display:inline-block;margin-top:0.6rem;background:none;padding:0;color:var(--tzu-red);font-size:0.76rem;font-weight:700;text-decoration:none">📋 課前準備 →</a>` : '';
    return `<div class="exp-card cat-${e.cat} ${e.id?'':'no-id'}">
      <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">${idBadge}
        <span class="badge badge-cat" style="font-size:0.72rem">${e.cat}</span></div>
      <h4>${e.title}</h4>
      <div class="meta"><span>⏱ ${e.duration} 分鐘</span><span>👥 ${e.format}</span></div>
      <div style="font-size:0.76rem;color:var(--text-light);margin-top:0.4rem">${e.concept}</div>${link}</div>`;
  }).join('');
}

/* ── Wire up ── */
['search','catFilter','locFilter','onlyFlagged'].forEach(id=>{
  document.getElementById(id).addEventListener(id==='search'?'input':'change', renderTable);
});
document.getElementById('cartFab').addEventListener('click', ()=>{ renderCart(); document.getElementById('modalBg').classList.add('show'); });
document.getElementById('closeModal').addEventListener('click', ()=>document.getElementById('modalBg').classList.remove('show'));
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('show'); });
document.getElementById('clearCart').addEventListener('click', ()=>{ if(confirm('確定清空目前的課堂清單？')){ cart={}; saveCart(); renderCart(); renderTable(); } });
document.getElementById('lessonName').addEventListener('input', renderCart);

/* ── Init ── */
loadCart();
renderStats();
renderTabs();
populateFilters();
renderTable();
saveCart();
</script>
</main>

<script src="js/shell.js?v=1"></script>
</body>
</html>
