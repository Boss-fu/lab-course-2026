<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>總覽 · 茲茲實驗課務系統</title>
<link rel="icon" href="茲茲icon.png">
<link rel="stylesheet" href="css/style2.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app-shell" data-active="dashboard"></div>

<main class="app-main">
  <div class="page-head">
    <h1>🏠 總覽</h1>
    <p>茲茲實驗課務系統 — 實驗規劃、課程組建與器材管理的中心</p>
  </div>

  <div class="page-body">
    <div class="dash-grid">
      <a class="stat-card gold" href="library.html">
        <div class="sc-label">🎨 創意實驗</div>
        <div class="sc-num" id="n-creative">–</div>
        <div class="sc-sub" id="s-creative">茲茲招牌實驗</div>
      </a>
      <a class="stat-card blue" href="curriculum.html">
        <div class="sc-label">📗 課綱實驗</div>
        <div class="sc-num" id="n-cur">–</div>
        <div class="sc-sub">國中＋高中標準實驗</div>
      </a>
      <a class="stat-card red" href="courses.html">
        <div class="sc-label">🎒 課程方案</div>
        <div class="sc-num" id="n-prog">–</div>
        <div class="sc-sub" id="s-prog">帶狀班・營隊</div>
      </a>
      <a class="stat-card green" href="materials.html">
        <div class="sc-label">🧰 器材庫存</div>
        <div class="sc-num" id="n-mat">154</div>
        <div class="sc-sub">四大分區</div>
      </a>
    </div>

    <div class="dash-section-title">快速前往</div>
    <div class="quick-tiles">
      <a class="q-tile" href="library.html"><div class="qt-ico">🎨</div><div class="qt-t">創意實驗</div><div class="qt-d">瀏覽茲茲招牌實驗，可跨年段重複使用</div></a>
      <a class="q-tile" href="curriculum.html"><div class="qt-ico">📗</div><div class="qt-t">課綱實驗</div><div class="qt-d">國高中課綱標準實驗清單專區</div></a>
      <a class="q-tile" href="courses.html"><div class="qt-ico">🎒</div><div class="qt-t">課程目錄</div><div class="qt-d">帶狀班、營隊等各套課程方案</div></a>
      <a class="q-tile" href="materials.html"><div class="qt-ico">🧰</div><div class="qt-t">器材管理</div><div class="qt-d">庫存查詢、勾選建立課堂清單</div></a>
      <a class="q-tile" href="generator.html"><div class="qt-ico">📝</div><div class="qt-t">講義生成器</div><div class="qt-d">快速產出實驗講義</div></a>
      <a class="q-tile" href="teacher.html"><div class="qt-ico">✅</div><div class="qt-t">課前準備</div><div class="qt-d">各堂課的流程、器材與助教筆記</div></a>
    </div>

    <div class="dash-section-title">課程方案</div>
    <div class="dash-grid" id="prog-preview"></div>
  </div>
</main>

<script src="js/experiments.js?v=2"></script>
<script src="js/curriculum.js?v=1"></script>
<script src="js/courses.js?v=1"></script>
<script src="js/shell.js?v=1"></script>
<script>
  document.getElementById('n-creative').textContent = EXPERIMENTS.length;
  const ready = EXPERIMENTS.filter(e=>e.status==='ready').length;
  document.getElementById('s-creative').textContent = `${ready} 個已完成講義`;
  document.getElementById('n-cur').textContent = CURRICULUM.length;
  document.getElementById('n-prog').textContent = COURSE_PROGRAMS.length;
  const running = COURSE_PROGRAMS.filter(p=>p.status==='開課中').length;
  const planning = COURSE_PROGRAMS.filter(p=>p.status==='規劃中').length;
  document.getElementById('s-prog').textContent = `${running} 開課中・${planning} 規劃中`;

  document.getElementById('prog-preview').innerHTML = COURSE_PROGRAMS.map(p=>{
    const st = (PROGRAM_STATUS_META[p.status]||{}).cls||'st-planned';
    return `<a class="stat-card ${p.accent}" href="${p.detail||'courses.html'}">
      <div class="sc-label">${p.type} · ${p.audience}</div>
      <div style="font-weight:800;color:var(--text);margin-top:0.35rem;font-size:1rem">${p.name}</div>
      <div class="sc-sub">${p.sessions?p.sessions+' 堂 · ':''}${p.cadence}</div>
      <div style="margin-top:0.5rem"><span class="progress-status ${st}">${p.status}</span></div>
    </a>`;
  }).join('');
</script>
</body>
</html>
